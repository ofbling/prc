version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null

  - name: dim_parts
    columns:
      - name: part_key
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: part_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_parts')
                field: part_key